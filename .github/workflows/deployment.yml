name: Deploy All Base Wearables

concurrency:
  group: avatar-assets-catalyst-${{ github.event.inputs.environment }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to deploy from'
        required: true
      environment:
        description: 'Target environment'
        required: true
        default: 'zone'
        type: choice
        options:
          - zone
          - peer-testing
          - production

jobs:
  deploy-wearables:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Set target URL
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "TARGET_URL=https://peer.decentraland.org" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" = "zone" ]; then
            echo "TARGET_URL=https://peer.decentraland.zone" >> $GITHUB_ENV
          else
            echo "TARGET_URL=https://peer-testing.decentraland.org" >> $GITHUB_ENV
          fi

      - name: Generate identity.json
        env:
          PRIVATE_KEY: ${{ secrets.ZONE_PRIVATE_KEY }}
          ETH_ADDRESS: ${{ secrets.ZONE_PUBLIC_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "Missing ZONE_PRIVATE_KEY secret"; exit 1; }
          test -n "$ETH_ADDRESS" || { echo "Missing ZONE_PUBLIC_KEY secret"; exit 1; }
          echo "{\"privateKey\": \"$PRIVATE_KEY\", \"ethAddress\": \"$ETH_ADDRESS\"}" > identity.json

      - name: Deploy All Wearables
        run: |
          set -euo pipefail
          DEPLOY_ARGS=()
          for collection_dir in assets/base-avatars/; do
            collection=$(basename "$collection_dir")
            while IFS= read -r asset_dir; do
              asset_json="$asset_dir/asset.json"
              asset_name=""
              if [ -f "$asset_json" ]; then
                asset_name=$(grep -o '"name": "[^"]*"' "$asset_json" | head -1 | sed 's/"name": "//g' | sed 's/"//g')
              fi
              if [ -z "$asset_name" ]; then
                asset_name=$(basename "$asset_dir")
              fi
              echo "Deploying dcl://$collection/$asset_name"
              DEPLOY_ARGS+=(--id "dcl://$collection/$asset_name")
            done < <(find "$collection_dir" -type d -mindepth 2 -maxdepth 2 | sort)
          done

          if [ "${#DEPLOY_ARGS[@]}" -eq 0 ]; then
            echo "No wearable entities found"
            exit 1
          fi

          yarn run deploy -- \
            --identityFilePath identity.json \
            --target "$TARGET_URL" \
            "${DEPLOY_ARGS[@]}"

      - name: Cleanup identity.json
        if: always()
        run: rm -f identity.json
